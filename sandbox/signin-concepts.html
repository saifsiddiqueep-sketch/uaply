<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAply sign-in concepts</title>
<meta name="description" content="Five clickable sign-in and sign-up concepts for UAply, each shown live in a desktop and a phone frame.">
<!-- SANDBOX ONLY: a look-around page for choosing a sign-in design. Nothing here is wired to the real sign-in, accounts or email.
     The brand fonts load without holding up the page (media="print" until they arrive): offline or blocked, it draws at once in the
     system fonts named after them in --display, --body and --mono. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* ---------- brand tokens, copied from prod/index.html ---------- */
:root{
  --bg:#FDF0F2; --surface:#FFFFFF; --ink:#2A1218; --muted:#7B5560; --line:#F3DADF;
  --accent:#C92A55; --accent2:#F0663B; --accent-ink:#FFFFFF;
  --yes:#0B8F62; --yes-bg:#DCF5EA; --no:#E03A45; --no-bg:#FDE5E6; --mid:#A86400; --mid-bg:#FCEFD0;
  --shadow:0 14px 34px -16px rgba(160,30,60,.4);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --page:#E4EFF5; --bezel:#1A0A0F; --scrim:rgba(6,24,32,.48);
  --g-bg:#FFFFFF; --g-ink:#1F1F1F; --g-line:#747775;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#190B10; --surface:#26131A; --ink:#FBE9EE; --muted:#C79BA6; --line:#40222B;
  --accent:#FF7A98; --accent2:#FFA86B; --accent-ink:#1A0A0F;
  --yes:#4ADE9C; --yes-bg:#123A2B; --no:#FF7A85; --no-bg:#3D1A25; --mid:#F5C265; --mid-bg:#3A2D10;
  --shadow:0 14px 34px -16px rgba(0,0,0,.85);
  --page:#050F14; --bezel:#000; --scrim:rgba(0,0,0,.6);
  --g-bg:#131314; --g-ink:#E3E3E3; --g-line:#8E918F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#190B10; --surface:#26131A; --ink:#FBE9EE; --muted:#C79BA6; --line:#40222B;
  --accent:#FF7A98; --accent2:#FFA86B; --accent-ink:#1A0A0F;
  --yes:#4ADE9C; --yes-bg:#123A2B; --no:#FF7A85; --no-bg:#3D1A25; --mid:#F5C265; --mid-bg:#3A2D10;
  --shadow:0 14px 34px -16px rgba(0,0,0,.85);
  --page:#050F14; --bezel:#000; --scrim:rgba(0,0,0,.6);
  --g-bg:#131314; --g-ink:#E3E3E3; --g-line:#8E918F;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- page shell ---------- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px max(16px,3vw) 10px}
.top .brand{display:flex;align-items:center;gap:12px;flex:1 1 280px;min-width:0}
.top h1{margin:0;font:800 22px/1.15 var(--display);letter-spacing:-.01em}
.top .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .brand p.pv{color:var(--ink);font-weight:500}
.top .brand p.pv b{font:700 11px var(--mono);letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:#E8A317;color:#2A1A00;margin-right:6px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button,.mot{font:600 13px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mot{border:1px solid var(--line);background:var(--surface)}
.mot[aria-pressed="true"]{color:var(--ink)}
.tabs{display:flex;gap:4px;padding:6px max(16px,3vw) 0;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--page);z-index:5}
.tab{font:600 14px var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;border-radius:10px 10px 0 0}
.tab .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--line);color:var(--ink);font:700 11px var(--mono)}
.tab:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
main{padding:20px max(16px,3vw) 60px}
.panel[hidden]{display:none}
.phead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;max-width:1100px}
.phead .big{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 20px var(--display)}
.phead h2{margin:0;font:800 clamp(20px,2.4vw,28px)/1.15 var(--display);letter-spacing:-.01em}
.phead p{margin:4px 0 0;color:var(--muted);max-width:75ch}

.stage{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.dev{margin:0;min-width:0}
.dev.desk{flex:1 1 560px}
.dev.phone{flex:0 0 auto;width:clamp(240px,24vw,330px);margin-inline:auto}
.dev figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 12px var(--mono);color:var(--muted);margin-bottom:8px}
.dev figcaption button{font:600 12px var(--body);color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.chrome{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 12px}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.chrome span{margin-left:10px;font:12px var(--mono);color:var(--muted);background:var(--bg);border-radius:6px;padding:3px 10px;flex:1;max-width:320px}
.fwrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--line)}
.desk .fwrap{border-radius:0 0 12px 12px;aspect-ratio:1280/720}
.phone .fwrap{border-radius:clamp(26px,3.4vw,44px);aspect-ratio:390/844;border:clamp(6px,.8vw,10px) solid var(--bezel);box-shadow:var(--shadow)}
.screen{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--bg)}
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;margin-top:22px;max-width:1300px}
@media (max-width:860px){.below{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.box h3{margin:0 0 10px;font:800 16px var(--display)}
.box ol,.box ul{margin:0;padding-left:20px}
.box li{margin:6px 0}
.mi{list-style:none;padding:0!important}
.mi li{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;font:600 11px var(--mono);border-radius:999px;padding:2px 8px;margin-top:2px}
.tag.b{background:var(--yes-bg);color:var(--yes)}
.tag.d{background:var(--mid-bg);color:var(--mid)}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}

/* why + compare */
.lead{max-width:78ch;font-size:16px}
.lead p{margin:0 0 12px}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 26px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.rule b{display:block;font:800 15px var(--display);margin-bottom:4px}
.rule p{margin:0;color:var(--muted);font-size:14px}
.rule .k{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.cgo{margin-top:10px;font:600 13px var(--body);color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
h3.sec{font:800 18px var(--display);margin:26px 0 10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
th{font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
tr:last-child td{border-bottom:0}
td b{font-family:var(--display)}
.score{font:800 22px var(--display);color:var(--accent)}
.eff{font:600 12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.decide{counter-reset:d;list-style:none;padding:0;margin:0;display:grid;gap:10px;max-width:90ch}
.decide li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 52px;position:relative}
.decide li::before{counter-increment:d;content:counter(d);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 14px var(--display)}

/* ================================================================
   APP UI (everything inside a frame). Same HTML and CSS in both
   frames; container queries on .app switch desktop and phone.
   ================================================================ */
.app{container:app/inline-size;width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
.lg{width:46px;height:46px;border-radius:14px;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:var(--shadow);flex:none}
.lg svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lg.sm{width:32px;height:32px;border-radius:10px;box-shadow:none}
.wm{font:800 19px var(--display);letter-spacing:-.01em}
.btn{font:600 15px/1.1 var(--body);min-height:48px;padding:0 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 86%,var(--ink))}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface)}
.btn.wide{width:100%}
.btn.g{background:var(--g-bg);color:var(--g-ink);border-color:var(--g-line);font-family:'Segoe UI',Roboto,var(--body)}
.btn.g:hover{box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn.g svg{width:20px;height:20px}
.btn[aria-busy="true"]{pointer-events:none;opacity:.85}
.btn[aria-busy="true"] .gicon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lnk{font:600 14px var(--body);color:var(--accent);background:none;border:0;padding:6px 4px;cursor:pointer;border-radius:6px}
.lnk:hover{text-decoration:underline}
.lnk[disabled]{color:var(--muted);cursor:default;text-decoration:none}
.sub{color:var(--muted);margin:0}
.fine{color:var(--muted);font-size:13px;margin:0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fld{display:flex;flex-direction:column}
.fld label{font-weight:600;font-size:14px;margin-bottom:6px}
.fld .in{position:relative}
.fld input{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:16px var(--body);padding:0 42px 0 14px;transition:border-color .15s,box-shadow .15s}
.fld input::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.bad input{border-color:var(--no)}
.fld.bad input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--no) 20%,transparent)}
.fld .tick{position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(.6);color:var(--yes);opacity:0;transition:opacity .2s,transform .2s;font-size:18px;display:flex}
.fld.good .tick{opacity:1;transform:translateY(-50%) scale(1)}
.fmsg{margin:6px 0 0;font-size:13px;color:var(--muted);min-height:0}
.fmsg:empty{display:none}
.fld.bad .fmsg,.fmsg.err{color:var(--no)}
.fix{font:600 13px var(--body);color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.agree{font-size:12.5px;color:var(--muted);margin:0;text-align:center;line-height:1.45}
.agree a,.agreeck a,.facts a{color:var(--accent)}
.agreeck{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;line-height:1.4}
.agreeck input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.agreeck span{flex:1;min-width:0}
.card1{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.chead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:2px}
.chead h1{font-size:26px;line-height:1.15}
.ctr{height:100%;overflow:auto;display:grid;place-items:center;padding:24px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pop{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.okc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--yes-bg);color:var(--yes);font-size:28px;margin:0 auto}
.done{display:flex;flex-direction:column;gap:12px;text-align:center}
.done h2{font-size:24px}
.demo{font:12px var(--mono);color:var(--muted);margin:0;text-align:center}

/* code boxes */
.code{display:flex;gap:8px;justify-content:center}
.code input{width:46px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;font:600 22px var(--mono);padding:0}
.code input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.code.err input{border-color:var(--no)}
.code.ok input{border-color:var(--yes)}
.codestep{display:flex;flex-direction:column;gap:12px;text-align:center}
.codestep h2{font-size:22px}
.codestep h2:focus{outline:none}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* facts (concept 2, 3) */
.facts{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.fh{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 2px}
.facts details{border-radius:10px}
.facts summary{list-style:none;display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px;line-height:1.4;padding:4px;border-radius:8px}
.facts summary::-webkit-details-marker{display:none}
.facts summary:hover{background:var(--bg)}
.facts .fi{flex:none;width:20px;height:20px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);color:var(--accent);margin-top:1px}
.facts summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;margin-top:3px}
.facts details[open] .chev{transform:rotate(90deg)}
.facts details p{margin:4px 4px 6px 34px;font-size:13px;color:var(--muted)}
.facts .agree{margin-top:6px}

/* job deck (concepts 1, 3) */
.deckbox{display:flex;flex-direction:column;align-items:center;width:100%}
.deck{position:relative;width:100%;max-width:340px;aspect-ratio:3/4;outline:none;border-radius:24px}
.deck:focus-visible{outline:3px solid var(--accent);outline-offset:8px}
.jc{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s ease}
.jc.top{cursor:grab}
.jc.grabbing{cursor:grabbing}
.jc-h{display:flex;gap:12px;align-items:center}
.jc-h b{display:block;font:800 20px/1.15 var(--display)}
.jc-h span{color:var(--muted);font-size:14px}
.app .mono{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 16px var(--display);color:var(--accent-ink);flex:none}
.pay{font:800 24px var(--display);letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.blurb{margin:0;color:var(--muted);font-size:14px}
.via{margin-top:auto;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px}
.via.u{background:var(--yes-bg);color:var(--yes)}
.via.s{background:var(--mid-bg);color:var(--mid)}
.stamp{position:absolute;top:22px;font:800 20px var(--display);padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;text-transform:uppercase;pointer-events:none;background:var(--surface)}
.stamp.yes{right:18px;color:var(--yes);transform:rotate(10deg)}
.stamp.no{left:18px;color:var(--no);transform:rotate(-10deg)}
.dacts{display:flex;justify-content:center;gap:22px;margin-top:22px}
.round{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;font-size:26px;transition:transform .12s}
.round:hover{transform:scale(1.06)}
.round:active{transform:scale(.94)}
.round.no{color:var(--no)}
.round.yes{background:var(--yes);color:var(--accent-ink);border-color:transparent}
.empty{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;border:2px dashed var(--line);border-radius:22px;padding:20px}
.keys{font:12px var(--mono);color:var(--muted);margin:10px 0 0}
.keys kbd,.kh kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface)}
.deckbox.compact .deck{max-width:236px;aspect-ratio:4/5}
.deckbox.compact .jc{padding:16px;gap:8px;border-radius:18px}
.deckbox.compact .jc-h b{font-size:16px}
.deckbox.compact .pay{font-size:18px}
.deckbox.compact .blurb{display:none}
.app .deckbox.compact .mono{width:38px;height:38px;font-size:13px;border-radius:11px}
.deckbox.compact .dacts{margin-top:14px;gap:16px}
.deckbox.compact .round{width:50px;height:50px;font-size:21px}

/* ---------- concept 1: swipe first ---------- */
.c1{height:100%;display:flex;flex-direction:column}
.abar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:6px;flex:0 1 420px;margin-inline:auto;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:0 6px 0 14px;min-height:42px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:15px var(--body);padding:8px 0}
.search input:focus{outline:none}
.search .dot{color:var(--muted)}
.heldchip{font:600 13px var(--body);background:var(--yes-bg);color:var(--yes);border-radius:999px;padding:5px 11px;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body)}
.who i{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:800}
.coach{margin:18px auto 0;font-size:14px;color:var(--muted);text-align:center;padding:0 20px}
.coach b{color:var(--ink)}
.dz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px 20px;min-height:0}
.ov{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;padding:24px;z-index:20;animation:fade .2s both}
.ov[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);width:100%;max-width:440px;padding:26px;display:flex;flex-direction:column;gap:13px;animation:dlgIn .28s cubic-bezier(.2,.8,.2,1) both;max-height:100%;overflow:auto}

.held{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.app .held .mono{width:40px;height:40px;font-size:14px;border-radius:12px}
.held b{display:block;font:800 16px var(--display)}
.held span{font-size:13px;color:var(--muted)}
.held>div{flex:1;min-width:0}
.held .via{margin:0;white-space:nowrap;font-size:12px}
.ready{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}

@container app (max-width:600px){

  .c1 .dlg{max-width:none;border-radius:26px 26px 0 0;padding:22px 20px 28px;animation-name:sheetIn}

}
@keyframes sheetIn{from{transform:translateY(40%);opacity:0}}

.c2{background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--accent2) 18%,transparent),transparent 70%),var(--bg)}
.pwrow{text-align:center;margin:-6px 0 -4px}
.c2.ctr{padding:12px 16px}
.c2 .card1{padding:22px 28px;gap:10px;max-width:452px}
.c2 .chead{gap:8px}
.c2 .chead .lg{width:40px;height:40px;border-radius:12px}
.c2 .chead h1{font-size:24px}
.c2 .facts{padding-top:10px;gap:2px}

/* ---------- concept 3: deck + card ---------- */
.c3{height:100%;display:grid;grid-template-columns:1.05fr 1fr}

.c3cap p{margin:6px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mid);background:var(--mid-bg);border-radius:999px;padding:3px 10px}
.tally{font:500 13px var(--mono);color:var(--muted)}
.c3a{display:grid;place-items:center;padding:28px;overflow:auto}
.liked{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.liked span{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--yes-bg);color:var(--yes);border-radius:999px;padding:4px 10px 4px 4px;animation:rise .3s both}
.liked span i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 10px var(--display);color:var(--accent-ink);font-style:normal}
.ph{display:none}

  .c3cap p{display:none}

  .c3a .chead h1{font-size:20px}

/* ---------- concept 5: glass box ---------- */
.c5{height:100%;overflow:auto}

.dchip{display:inline-flex;gap:6px;align-items:center;font-size:13px;border-radius:10px;padding:6px 10px;background:var(--bg);border:1.5px solid var(--line);max-width:100%;transition:all .25s}

.dchip.wait{border-style:dashed;color:var(--muted);background:transparent}
.dchip.lock{background:var(--yes-bg);border-color:transparent;color:var(--yes)}
.dchip.pend{border-style:dashed;color:var(--muted);background:transparent}
.dchip.filled{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent);color:var(--ink)}
.dchip.hl{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 35%,transparent);border-color:var(--accent2)}
.dchip.in{animation:chipIn .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes chipIn{0%{transform:scale(.7);opacity:.2}100%{transform:none;opacity:1}}
.gnote{margin-top:12px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.never{margin:12px 0 0;font-size:13px;color:var(--muted)}

  .c5f .chead h1{font-size:22px}
  .lanes{grid-template-columns:1fr}
  .lane{min-height:0;padding:12px 14px}
  .lane .chips{flex-direction:row;flex-wrap:wrap}
}

function codeStep(email,opt){
  var el=h('<div class="codestep pop"><h2 tabindex="-1">Check your email</h2><p class="sub">We sent a 6-digit code to <b style="color:var(--ink)">'+esc(email)+'</b>. It works for 10 minutes.</p>'+
    '<div class="code" role="group" aria-label="6-digit code"></div><p class="fmsg cmsg" aria-live="polite"></p><p class="demo">Demo: any 6 digits work. 000000 shows the error.</p>'+
    '<div class="between"><button type="button" class="lnk chg">Use a different email</button><button type="button" class="lnk resend" disabled>New code in <span>30</span>s</button></div></div>');
  var box=el.querySelector(".code"),msg=el.querySelector(".cmsg");
  for(var i=0;i<6;i++)box.appendChild(h('<input inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Digit '+(i+1)+'"'+(i===0?' autocomplete="one-time-code"':' autocomplete="off"')+'>'));
  var ins=[].slice.call(box.querySelectorAll("input")),checking=false;
  function fill(t,start){for(var k=0;k+start<6&&k<t.length;k++)ins[start+k].value=t[k];fx(ins[Math.min(5,start+t.length)]);check()}
  function check(){var c=ins.map(function(x){return x.value}).join("");if(c.length<6||checking)return;checking=true;box.classList.remove("err");msg.classList.remove("err");msg.textContent="Checking…";
    setTimeout(function(){checking=false;
      if(c==="000000"){box.classList.add("err");msg.classList.add("err");msg.textContent="That code doesn’t match. Check the newest email from UAply.";box.classList.remove("shake");void box.offsetWidth;if(!RM())box.classList.add("shake");ins.forEach(function(x){x.value=""});fx(ins[0]);return}
      box.classList.add("ok");msg.textContent="Code accepted.";ins.forEach(function(x){x.disabled=true});setTimeout(opt.onOk,RM()?50:350)},RM()?50:450)}
  ins.forEach(function(inp,i){
    inp.addEventListener("input",function(){var v=inp.value.replace(/\D/g,"");if(v.length>1){inp.value="";fill(v,i);return}inp.value=v;if(v&&i<5)fx(ins[i+1]);check()});
    inp.addEventListener("keydown",function(e){
      if(e.key==="Backspace"&&!inp.value&&i>0){e.preventDefault();ins[i-1].value="";fx(ins[i-1])}
      else if(e.key==="ArrowLeft"&&i>0){e.preventDefault();fx(ins[i-1])}
      else if(e.key==="ArrowRight"&&i<5){e.preventDefault();fx(ins[i+1])}});
    inp.addEventListener("paste",function(e){var t=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"");if(t){e.preventDefault();fill(t.slice(0,6),0)}});
    inp.addEventListener("focus",function(){inp.select()});
  });
  el.querySelector(".chg").onclick=opt.onBack;
  var rs=el.querySelector(".resend"),n=30,iv=setInterval(function(){if(!el.isConnected){clearInterval(iv);return}n--;if(n<=0){clearInterval(iv);rs.disabled=false;rs.textContent="Send a new code"}else rs.querySelector("span").textContent=n},1000);
  rs.onclick=function(){msg.classList.remove("err");msg.textContent="A new code is on its way.";rs.disabled=true;rs.innerHTML="Sent";};
  el.start=function(){fx(el.querySelector("h2"));setTimeout(function(){fx(ins[0])},RM()?0:250)};
  return el;
}

function makeDeck(host,opt){

   ["5","Glass box","Sign-up beside a live map of where each detail goes; consent you see rather than read.","Google: 2 taps + 1 tick. Email: 2 fields + 1 tick + code.","Privacy labels from app stores.","Focus a field, see who gets it; Google fills the map with what it actually shares. Nobody in job search does this.","The map must stay exactly true as the product changes (legal review on every change); more on screen for people who don’t care.","M",7]
  ];
  return '<div class="phead"><span class="big">≡</span><div><h2>Compare</h2><p>Friction counts taps and fields to the first useful screen (the cards, or a signed-in account). Effort runs XS to L.</p></div></div>'+
  '<div class="tablewrap"><table><thead><tr><th>Concept</th><th>The idea</th><th>Friction</th><th>Borrows</th><th>Invents</th><th>Risks</th><th>Effort</th><th>Score</th></tr></thead><tbody>'+
  R.map(function(r){return '<tr><td><b>'+r[0]+'. '+r[1]+'</b></td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td>'+r[6]+'</td><td><span class="eff">'+r[7]+'</span></td><td><span class="score">'+r[8]+'</span>/10</td></tr>'}).join("")+'</tbody></table></div>'+
  '<h3 class="sec">My recommendation</h3><div class="lead"><p><b>Ship concept 2 now and make it the card that concept 1 opens.</b> Concept 2 fixes all three complaints with the smallest change. Then move the ask to the first swipe right (concept 1), which is the biggest gain in sign-ups. Borrow the glass-box map (concept 5) for Data and privacy and for the “more” view of the three facts. Keep concept 3 for the desktop landing page, and concept 4’s questions for Profile setup after sign-in, not before.</p></div>'+
  '<h3 class="sec">What the owner should decide</h3><ol class="decide">'+
  '<li><b>Passwords:</b> keep email and password, or switch to a 6-digit email code with “Prefer a password?” as the backup.</li>'+
  '<li><b>When to ask:</b> at Get started (today), or at the first swipe right (concept 1). Asking later changes the swipe lock.</li>'+
  '<li><b>How to agree:</b> a “By continuing…” line (saves a tap) or one tick box covering Google and email (safest). Either replaces today’s two boxes.</li>'+
  '<li><b>The 165 words:</b> whether three short facts, each opening to the full text, can replace the first-open agreement dialog.</li></ol>';
}

/* build tabs and panels */
var TABS=[{id:"why",label:"Why these 5",n:"?"}].concat(CONCEPTS.map(function(c,i){return {id:c.id,label:c.tab,n:String(i+1)}})).concat([{id:"compare",label:"Compare",n:"≡"}]);
var tabsEl=d.getElementById("tabs"),panels=d.getElementById("panels");
TABS.forEach(function(t){
  tabsEl.appendChild(h('<button type="button" role="tab" class="tab" id="t-'+t.id+'" aria-controls="p-'+t.id+'" aria-selected="false" tabindex="-1"><span class="n">'+t.n+'</span>'+t.label+'</button>'));
  var p=h('<section class="panel" role="tabpanel" id="p-'+t.id+'" aria-labelledby="t-'+t.id+'" tabindex="0" hidden></section>');
  if(t.id==="why")p.innerHTML=whyHTML();
  else if(t.id==="compare")p.innerHTML=compareHTML();
  else{
    var c=CONCEPTS.filter(function(x){return x.id===t.id})[0],i=CONCEPTS.indexOf(c)+1;
    p.innerHTML='<div class="phead"><span class="big">'+i+'</span><div><h2>'+c.title+'</h2><p>'+c.idea+'</p></div></div>'+
      '<div class="stage">'+
        '<figure class="dev desk"><figcaption><span>Desktop · 1280 × 720</span><button type="button" class="rst">Restart</button></figcaption><div class="chrome" aria-hidden="true"><i></i><i></i><i></i><span>UAply · sign in</span></div><div class="fwrap" data-w="1280" data-h="720"><div class="screen" style="width:1280px;height:720px"><div class="app" data-kind="desk"></div></div></div></figure>'+
        '<figure class="dev phone"><figcaption><span>Phone · 390 × 844</span><button type="button" class="rst">Restart</button></figcaption><div class="fwrap" data-w="390" data-h="844"><div class="screen" style="width:390px;height:844px"><div class="app" data-kind="phone"></div></div></div></figure>'+
      '</div><div class="below"><div class="box"><h3>Rationale</h3><ol>'+c.why.map(function(w){return '<li>'+w+'</li>'}).join("")+'</ol></div>'+
      '<div class="box"><h3>Micro-interactions</h3><ul class="mi">'+c.mi.map(function(m){return '<li><span class="tag '+m[0]+'">'+(m[0]==="b"?"built":"described")+'</span><span>'+m[1]+'</span></li>'}).join("")+'</ul></div></div>';
    p._concept=c;
  }
  panels.appendChild(p);
});

/* scale each frame to its box */
var ro=new ResizeObserver(function(es){es.forEach(function(e){fit(e.target)})});
function fit(fw){var W=+fw.dataset.w,s=fw.clientWidth/W;if(!s)return;var sc=fw.firstElementChild;sc.style.transform="scale("+s+")";sc.dataset.s=s}
function mountPanel(p){
  if(p._mounted||!p._concept)return;p._mounted=true;
  [].forEach.call(p.querySelectorAll(".dev"),function(fig){
    var app=fig.querySelector(".app"),fw=fig.querySelector(".fwrap");ro.observe(fw);fit(fw);
    p._concept.mount(app);
    fig.querySelector(".rst").onclick=function(){app.innerHTML="";p._concept.mount(app)};
  });
}
/* demo links never leave the page */
d.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-demo]");if(a){e.preventDefault();var app=a.closest(".app");if(app)toast(app,"In the app this opens "+a.getAttribute("href")+" in a new tab.")}});

/* tabs: click, ←/→, Home/End (automatic activation) */
var tabBtns=[].slice.call(tabsEl.querySelectorAll(".tab"));
function select(id,focus){
  tabBtns.forEach(function(b){var on=b.id==="t-"+id;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1;d.getElementById(b.getAttribute("aria-controls")).hidden=!on;if(on&&focus)b.focus();if(on)b.scrollIntoView({block:"nearest",inline:"nearest"})});
  mountPanel(d.getElementById("p-"+id));
  store("uaply-concepts-tab",id);
  if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);
}
tabBtns.forEach(function(b,i){
  b.addEventListener("click",function(){select(b.id.slice(2))});
  b.addEventListener("keydown",function(e){var n=null;if(e.key==="ArrowRight")n=(i+1)%tabBtns.length;else if(e.key==="ArrowLeft")n=(i-1+tabBtns.length)%tabBtns.length;else if(e.key==="Home")n=0;else if(e.key==="End")n=tabBtns.length-1;if(n!==null){e.preventDefault();select(tabBtns[n].id.slice(2),true)}});
});
panels.addEventListener("click",function(e){var g=e.target.closest(".cgo");if(g){select(g.dataset.go,true);window.scrollTo({top:0})}});
var start=(location.hash||"").slice(1);if(!TABS.some(function(t){return t.id===start}))start=store("uaply-concepts-tab")||"why";if(!TABS.some(function(t){return t.id===start}))start="why";
select(start);

/* theme + motion */
function setTheme(t){if(t==="auto")delete root.dataset.theme;else root.dataset.theme=t;[].forEach.call(d.querySelectorAll("[data-th]"),function(b){b.setAttribute("aria-pressed",b.dataset.th===t)});store("uaply-concepts-theme",t)}
[].forEach.call(d.querySelectorAll("[data-th]"),function(b){b.onclick=function(){setTheme(b.dataset.th)}});
setTheme(store("uaply-concepts-theme")||"auto");
var mot=d.getElementById("motBtn");
function setMot(on){if(on)root.dataset.motion="reduce";else delete root.dataset.motion;mot.setAttribute("aria-pressed",on);mot.textContent="Reduce motion: "+(on?"on":"off");store("uaply-concepts-motion",on?"1":"0")}
mot.onclick=function(){setMot(root.dataset.motion!=="reduce")};
setMot(store("uaply-concepts-motion")==="1");
window.__concepts={select:select,TABS:TABS};
})();
</script>
</body>
</html>
