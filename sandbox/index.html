<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UAply">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF0F2">
<title>UAply sandbox</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
/* SANDBOX: every experiment can be toggled freely. Own storage key, never touches prod or dev data. */
:root{--bg:#FDF0F2;--surface:#FFFFFF;--ink:#2A1218;--muted:#7B5560;--line:#F3DADF;--accent:#C92A55;--accent2:#F0663B;--accent-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#190B10;--surface:#26131A;--ink:#FBE9EE;--muted:#C79BA6;--line:#40222B;--accent:#FF7A98;--accent2:#FFA86B;--accent-ink:#1A0A0F}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 'DM Sans','Segoe UI',system-ui,sans-serif}
.top{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row b{font-weight:700}
.badge{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:#E8A317;color:#2A1A00}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.chips button,.row>button,.seg button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;font-weight:600}
.chips button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.seg{display:flex;gap:4px}
.note{margin:0;color:var(--muted);min-height:1.4em}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:6px 10px 10px}
.top.min .chips,.top.min #note{display:none}
iframe{border:1px solid var(--line);border-radius:14px;background:var(--bg);width:100%;height:100%}
.stage.phone iframe{width:390px}
/* app mode (phones, Home Screen, or ?app=1): no sandbox controls, the app fills the screen like an installed app */
html,body{overscroll-behavior:none}
body.app{height:100vh;height:100dvh;background:var(--bg)}
body.app .top,body.app .log{display:none!important}
body.app .stage{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) max(0px,calc(env(safe-area-inset-bottom,0px) - 12px)) env(safe-area-inset-left,0px)}
body.app iframe{border:0;border-radius:0;width:100%!important}
.log{display:none;height:90px;overflow:auto;margin:0 10px 10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted)}
.log.on{display:block}.log b{color:var(--ink)}
</style>
</head>
<body>
<div class="top">
  <div class="row"><span class="badge">SANDBOX</span><b>UAply</b><span class="note" style="flex:1 1 200px">Experiment freely. Reads a copy of index.html (prod); prod is never changed.</span>
    <div class="seg" id="size"><button data-s="desktop" aria-pressed="true">Desktop</button><button data-s="phone" aria-pressed="false">Phone</button></div>
    <button id="all" type="button">All on</button><button id="none" type="button">All off</button><button id="reset" type="button">Clear saved swipes</button><button id="fold" type="button" aria-expanded="true">Hide controls</button></div>
  <div class="chips" id="feats" role="group" aria-label="Experiments"></div>
  <p class="note" id="note">Pick an experiment to see what it does.</p>
</div>
<div class="stage" id="stage"><iframe id="app" title="UAply sandbox build" allow="geolocation"></iframe></div>
<div class="log" id="log" aria-live="polite"></div>
<script>window.UAplyOpts={nearMe:true,consentFirst:true,simpleTabs:true,navLift:0,
  /* Stripe Payment Links (TEST mode, "UAply sandbox" Stripe account): used where there is no server, like the GitHub Pages copy */
  stripeLinks:{starter:"https://buy.stripe.com/test_00w6oA7S25nWcZUcEDcEw00",pro:"https://buy.stripe.com/test_dRm9AM8W6aIgcZU8oncEw01"}};   /* sandbox only: ask for device location and show the commute slider; ask for consent once, before the first swipe */</script>
<script src="uaply-nav.js"></script>
<script src="uaply-live.js"></script>
<script src="uaply-profile.js"></script>
<script src="uaply-chat.js"></script>
<script src="uaply-learn.js"></script>
<script src="uaply-envs.js"></script>
<script src="uaply-employers.js"></script>
<script src="uaply-resume.js"></script>
<script>
(function(){
var KEY="hireswipe.sandbox.v1",E=window.UAplyEnv,
    _ci=E.ORDER.indexOf("confirm");if(_ci>-1)E.ORDER.splice(_ci,1);   /* a swipe right is the whole action here: no "Save to Applied?" question, not even with All on */
/* glide (Phone swipe) decides every swipe when on; easy and axis stay on so switching glide off in the controls falls back to them */
var on={glide:true,learn:true,easy:true,axis:true,nav:true,profile:true,live:true,kit:true,submit:true,smart:true,fit:true,anim:true,guide:true,tap:true,dates:true,hint:true,chat:true,employers:true,resume:true};
var frame=document.getElementById("app"),noteEl=document.getElementById("note"),logEl=document.getElementById("log");
function load(){logEl.classList.remove("on");logEl.innerHTML="";E.run(frame,on,KEY,function(err){if(err)noteEl.textContent="Problem: "+err})}
function paint(n){document.querySelectorAll("#feats button").forEach(function(b){b.setAttribute("aria-pressed",on[b.dataset.k]?"true":"false")});if(n)noteEl.textContent=n}
E.ORDER.forEach(function(k){
  var b=document.createElement("button");b.type="button";b.dataset.k=k;b.textContent=E.FEATURES[k].name;b.setAttribute("aria-pressed","false");
  b.onclick=function(){on[k]=!on[k];paint(E.FEATURES[k].name+(on[k]?" on: ":" off: ")+E.FEATURES[k].note);load()};
  document.getElementById("feats").appendChild(b);
});
document.getElementById("all").onclick=function(){E.ORDER.forEach(function(k){on[k]=true});paint("All experiments on.");load()};
document.getElementById("none").onclick=function(){on={};paint("All off: matches production behavior.");load()};
document.getElementById("reset").onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}load()};
document.querySelectorAll("#size button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("#size button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
  document.getElementById("stage").className="stage"+(b.dataset.s==="phone"?" phone":"");
}});
var topEl=document.querySelector(".top"),fold=document.getElementById("fold");
function setMin(m){topEl.classList.toggle("min",m);fold.textContent=m?"Show controls":"Hide controls";fold.setAttribute("aria-expanded",m?"false":"true")}
fold.onclick=function(){setMin(!topEl.classList.contains("min"))};
setMin(window.innerHeight<800);
/* phones get the app full screen; ?controls=1 brings the sandbox controls back, ?app=1 forces app mode anywhere */
var qs=location.search,standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
if(standalone||/[?&]app=1/.test(qs)||(window.innerWidth<700&&!/[?&]controls=1/.test(qs)))document.body.classList.add("app");
paint("On by default: "+E.ORDER.filter(function(k){return on[k]}).map(function(k){return E.FEATURES[k].name}).join(", ")+".");   /* read from `on` above, so the list never goes stale */
load();
})();
</script>
</body>
</html>
