name: Check the code

# Runs on every push and every pull request, so a change with a syntax error or a broken experiment is flagged
# before anyone merges it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pypdf is in requirements.txt (Render installs it); here it lets tools/test-resume.py read the PDF resumes too
      - name: Install the Python linters and the PDF reader
        run: python -m pip install pyflakes ruff pypdf
      - name: Run all checks
        run: node check.js
      # Ruff with only the rules that mean "this will crash": syntax errors, undefined names, invalid comparisons and prints
      - name: Python syntax and undefined names (Ruff)
        run: python -m ruff check --select E9,F63,F7,F82 --output-format github .
      # Every page and email the server builds renders, every script parses, no line break JavaScript would join, shell scripts parse
      - name: Pages, scripts and shell scripts
        run: python tools/test-pages.py
      - name: Audit every file
        run: |
          python -m pip install pyyaml
          python tools/audit-files.py
      # The behavior tests that need no browser, network or open port. The rest (screens, swipes, Google, the public server)
      # run on the owner's computer with: bash tools/run-all-tests.sh
      - name: Test job rules, email codes, delivery to employers, the setup form and the emails
        run: |
          python tools/test-jobs.py
          python tools/test-verify.py
          python tools/test-delivery.py
          python tools/test-setup.py
          python tools/test-emails.py
          python tools/test-support.py
          python tools/test-ats.py
          python tools/test-ats-ashby.py
          python tools/test-ats-smartrecruiters.py
          python tools/test-ats-flow.py
          python tools/test-billing.py
          python tools/test-autofill.py
          python tools/test-resume.py
      # The server started exactly as Render starts it (Linux shell, $PORT, a disk folder, SIGTERM at each deploy), on Render's Python version
      - name: Test the Render deploy (start, restart on the same disk, stop)
        run: python tools/test-render.py
