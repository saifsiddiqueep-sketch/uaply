name: Publish hosted sandbox and dev

# A push to the sandbox or dev branch rebuilds and republishes the hosted pages. The production page is never
# published from here. The hosted copies use the example jobs (a static host cannot run the Python back end).
# Back on October 22, 2026, while the repository is public until launch (retired on October 21 when it went private):
#   https://saifsiddiqueep-sketch.github.io/uaply/sandbox.html and dev.html (and the .full.html names, the same pages),
#   and the older /sandbox/ and /dev/ addresses. The Render preview https://uaply-sandbox-preview.onrender.com/sandbox.html
#   is the second copy.
on:
  push:
    branches: [sandbox, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sandbox
          path: sb
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dv
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build both hosted pages
        run: |
          (cd sb && node share/build-share.js --full)
          (cd dv && node share/build-share.js --full)
          mkdir -p site/sandbox site/dev
          # complete pages (doctype, head with the icons) under every published name: share/sandbox.html itself is the body only,
          # for a host that adds the document around it, so it is not published as it is
          cp sb/share/sandbox.full.html site/sandbox.html
          cp sb/share/sandbox.full.html site/sandbox.full.html
          cp dv/share/dev.full.html site/dev.html
          cp dv/share/dev.full.html site/dev.full.html
          cp sb/share/sandbox.full.html site/sandbox/index.html
          cp dv/share/dev.full.html site/dev/index.html
          # the pages ask for these icons next to themselves; without the copies the browser shows a plain globe
          cp sb/sandbox/favicon-32.png sb/sandbox/favicon-192.png sb/sandbox/apple-touch-icon.png site/sandbox/
          cp dv/dev/favicon-32.png dv/dev/favicon-192.png dv/dev/apple-touch-icon.png site/dev/
          # the sandbox's Sign-in concepts button opens this look-around page next to it (sandbox only; dev never gets it)
          if [ -f sb/sandbox/signin-concepts.html ]; then cp sb/sandbox/signin-concepts.html site/sandbox/; fi
          cp sb/sandbox/favicon-32.png sb/sandbox/favicon-192.png sb/sandbox/apple-touch-icon.png site/
          cp -r sb/legal site/legal
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
          <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
          <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
          <title>UAply</title>
          <body style="font:16px system-ui;max-width:32rem;margin:3rem auto;padding:0 1rem">
          <h1>UAply</h1><p><a href="sandbox.html">Sandbox</a> &middot; <a href="dev.html">Dev</a></p>
          <p>Hosted copies with example jobs. Real jobs and sending run only on the Python back end.</p>
          <h2 style="font-size:1.1rem">Make a change</h2>
          <p><a href="https://github.dev/${{ github.repository }}/tree/sandbox">Edit the sandbox</a> &middot;
          <a href="https://github.dev/${{ github.repository }}/tree/dev">Edit dev</a></p>
          <p>These open the code in your browser (sign in to GitHub). When you save, your change is sent to the owner as a
          proposal, and the live pages update after the owner approves it.</p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
