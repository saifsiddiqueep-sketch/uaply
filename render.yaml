# Render Blueprint: deploys UAply sandbox and dev as two web services from this repository.
# What runs today (October 22, 2026): ONE service, "uaply" (srv-db9i3i6q1p3s738b5b4g, branch dev, Starter, Virginia, 1 GB disk at /var/data),
# made by hand in the dashboard on October 17, not from this file, so editing this file changes nothing there: its settings live in the
# dashboard (DEPLOY.md, "Running the live site"). There is no sandbox service on Render; the sandbox runs on the owner's computer. This file
# is the reference for a fresh setup and what tools/test-render.py checks (the start command, the disk, the health check, no secrets).
# The repository is private: Render reads it only through its GitHub app (DEPLOY.md, Auto-deploy). The address is https://uaply.net
# through Cloudflare (CNAMEs proxied, SSL/TLS Full (strict)); the server trusts CF-Connecting-IP only from Cloudflare's published ranges.
# In Render: New > Blueprint, pick this repository, then fill in the secret values it asks for.
# Values marked sync: false are secrets: you type them into Render's dashboard; they are never stored in the repository.
# Render asks for them only when the Blueprint is first created; later syncs ignore them (change them under the service's Environment).
# plan starter (0.5 CPU, 512 MB; Render's newer name for it is 0.5c-512mb) is the smallest plan that can have a disk: the free plan has none,
# so every account and application would be lost at each deploy. With a disk Render stops the old copy before starting the new one, so each
# deploy has a short gap (seconds) and the service always runs as exactly one copy. Proven by tools/test-render.py.
services:
  - type: web
    name: uaply-dev
    runtime: python
    branch: dev
    plan: starter
    region: virginia                # US East, nearest to Philadelphia. Render cannot move a service to another region later.
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py ${PORT:-10000} dev --api   # Render sets PORT (10000 by default); the fallback keeps a blank PORT from stopping the start
    healthCheckPath: /healthz        # answered from memory; 503 while stopping. Must ALSO be set in the dashboard (Settings > Health Checks) for a service made by hand
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: UAPLY_DATA_DIR
        value: /var/data
      - key: MALLOC_ARENA_MAX         # glibc keeps 2 memory pools instead of up to 8 per CPU: with Python's threads, freed memory is reused, not held per thread
        value: "2"
      - key: UAPLY_FEEDS              # real postings from employers' own public career pages (link-out only). Remove this line to switch them off.
        value: greenhouse,lever,ashby
      - key: ANTHROPIC_API_KEY        # turns on AI answers in the assistant; swap it any time without a code change
        sync: false
      - key: OWNER_PASSWORD           # protects /outbox, /feedback and /setup (without it those pages are off)
        sync: false
      - key: SUPPORT_EMAIL            # shown as "Talk to a person"
        sync: false
      - key: UAPLY_CONFIG_JSON        # optional: the rest of uaply-config.json as one line of JSON (smtp, public_url, google, delivery); see DEPLOY.md
        sync: false
      - key: UAPLY_PUBLIC_URL         # https://uaply.net (set on the live service as its own variable since October 21). It wins over
                                      # public_url in UAPLY_CONFIG_JSON, sends pages on www.uaply.net and the onrender.com address to it
                                      # with a 301 (never /api/ or /healthz, so webhooks, Google and the health check keep working), except
                                      # the home page there, which says "UAply has moved" and offers a backup first when the browser holds
                                      # UAply data, and adds the canonical link, /sitemap.xml and the Sitemap line in robots.txt. Never on a
                                      # sandbox. DEPLOY.md, section 1.
        sync: false
      # UAPLY_PLANS_HIDDEN=1 (optional): a free-only launch. Plan and billing shows only Free and "Plus and Pro are coming soon"; checkout is refused.
      # UAPLY_ASSETLINKS_SHA256 (dev only, once the Play app exists): the two SHA-256 fingerprints from Play Console, App signing (app signing key
      # and upload key), comma-separated. /.well-known/assetlinks.json then links the Play app com.uaply.app to the site (mobile/twa/README.md).
      - key: UAPLY_USAJOBS_KEY        # the free USAJOBS key (wins over feed_keys.usajobs), set on the live service since October 21;
                                      # usajobs must also be in UAPLY_FEEDS (the live service's own list is on its Environment page)
        sync: false
      - key: UAPLY_USAJOBS_EMAIL      # the address the USAJOBS key was requested with (uaplytechnologies@gmail.com); set since October 21
        sync: false
      - key: UAPLY_COS_USER_ID        # CareerOneStop / NLx Jobs API user id (docs/job-sources.md); with UAPLY_COS_TOKEN, and careeronestop in UAPLY_FEEDS
        sync: false
      - key: UAPLY_COS_TOKEN          # CareerOneStop / NLx Jobs API token (secret: never logged, never sent to a browser)
        sync: false
      - key: STRIPE_SECRET_KEY        # LIVE mode only on dev (the real site): sk_live_..., or none until payments start (DEPLOY.md, section 4)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_... of the live webhook endpoint https://uaply.onrender.com/api/billing/webhook
                                      # moves to https://uaply.net/api/billing/webhook when the live keys go in; keep the onrender address enabled in Stripe until then
        sync: false
      - key: STRIPE_PRICE_PLUS        # the live UAply Plus price, $9.99 a month (price_...)
        sync: false
      - key: STRIPE_PRICE_PRO         # the live UAply Pro price, $19.99 a month (price_...)
        sync: false
    disk:
      name: uaply-dev-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: uaply-sandbox                # not created on Render (the sandbox runs on the owner's computer); kept for a fresh two-service setup
    runtime: python
    branch: sandbox
    plan: starter
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py ${PORT:-10000} sandbox --api
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: UAPLY_DATA_DIR
        value: /var/data
      - key: MALLOC_ARENA_MAX         # glibc keeps 2 memory pools instead of up to 8 per CPU: with Python's threads, freed memory is reused, not held per thread
        value: "2"
      - key: UAPLY_FEEDS              # dev's feeds plus recruitee (sandbox-only until Saif switches it on for dev). Remove this line to switch them off.
        value: greenhouse,lever,ashby,recruitee
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: UAPLY_CONFIG_JSON
        sync: false
      - key: STRIPE_SECRET_KEY        # test mode only on sandbox: sk_test_... from the "UAply sandbox" Stripe account
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_... of the webhook endpoint https://<sandbox host>/api/billing/webhook
        sync: false
      - key: STRIPE_PRICE_PLUS        # UAply Plus, $9.99 a month (test mode)
        value: price_1URCnQ3W5nziA1EGPUIlUvqL
      - key: STRIPE_PRICE_PRO         # UAply Pro, $19.99 a month (test mode)
        value: price_1URCo23W5nziA1EGMxedtAzb
    disk:
      name: uaply-sandbox-data
      mountPath: /var/data
      sizeGB: 1
