# Render Blueprint: deploys UAply sandbox and dev as two web services from this repository.
# In Render: New > Blueprint, pick this repository, then fill in the secret values it asks for.
# Values marked sync: false are secrets: you type them into Render's dashboard; they are never stored in the repository.
# Render asks for them only when the Blueprint is first created; later syncs ignore them (change them under the service's Environment).
# plan starter (0.5 CPU, 512 MB; Render's newer name for it is 0.5c-512mb) is the smallest plan that can have a disk: the free plan has none,
# so every account and application would be lost at each deploy. With a disk Render stops the old copy before starting the new one, so each
# deploy has a short gap (seconds) and the service always runs as exactly one copy. Proven by tools/test-render.py.
services:
  - type: web
    name: uaply-dev
    runtime: python
    branch: dev
    plan: starter
    region: virginia                # US East, nearest to Philadelphia. Render cannot move a service to another region later.
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py ${PORT:-10000} dev --api   # Render sets PORT (10000 by default); the fallback keeps a blank PORT from stopping the start
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: UAPLY_DATA_DIR
        value: /var/data
      - key: UAPLY_FEEDS              # real postings from employers' own public career pages (link-out only). Remove this line to switch them off.
        value: greenhouse,lever,ashby
      - key: ANTHROPIC_API_KEY        # turns on AI answers in the assistant; swap it any time without a code change
        sync: false
      - key: OWNER_PASSWORD           # protects /outbox, /feedback and /setup (without it those pages are off)
        sync: false
      - key: SUPPORT_EMAIL            # shown as "Talk to a person"
        sync: false
      - key: UAPLY_CONFIG_JSON        # optional: the rest of uaply-config.json as one line of JSON (smtp, public_url, google, delivery); see DEPLOY.md
        sync: false
      - key: STRIPE_SECRET_KEY        # LIVE mode only on dev (the real site): sk_live_..., or none until payments start (DEPLOY.md, section 4)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_... of the live webhook endpoint https://uaply.onrender.com/api/billing/webhook
        sync: false
      - key: STRIPE_PRICE_PLUS        # the live UAply Plus price, $9.99 a month (price_...)
        sync: false
      - key: STRIPE_PRICE_PRO         # the live UAply Pro price, $19.99 a month (price_...)
        sync: false
    disk:
      name: uaply-dev-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: uaply-sandbox
    runtime: python
    branch: sandbox
    plan: starter
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py ${PORT:-10000} sandbox --api
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: UAPLY_DATA_DIR
        value: /var/data
      - key: UAPLY_FEEDS              # the same real postings as dev, so the test bench shows what users see. Remove this line to switch them off.
        value: greenhouse,lever,ashby
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: UAPLY_CONFIG_JSON
        sync: false
      - key: STRIPE_SECRET_KEY        # test mode only on sandbox: sk_test_... from the "UAply sandbox" Stripe account
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_... of the webhook endpoint https://<sandbox host>/api/billing/webhook
        sync: false
      - key: STRIPE_PRICE_PLUS        # UAply Plus, $9.99 a month (test mode)
        value: price_1URCnQ3W5nziA1EGPUIlUvqL
      - key: STRIPE_PRICE_PRO         # UAply Pro, $19.99 a month (test mode)
        value: price_1URCo23W5nziA1EGMxedtAzb
    disk:
      name: uaply-sandbox-data
      mountPath: /var/data
      sizeGB: 1
