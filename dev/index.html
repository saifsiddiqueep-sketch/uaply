<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UAply: swipe right to apply to jobs that match your profile.">
<title>UAply</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#FDF0F2">
<link rel="manifest" href="/uaply.webmanifest">
<style>
/* DEV: a fixed release candidate. Edit PROMOTED below to change what is in it. Own storage key. */
:root{--bg:#FDF0F2;--surface:#FFFFFF;--ink:#2A1218;--muted:#7B5560;--line:#F3DADF}
@media (prefers-color-scheme: dark){:root{--bg:#190B10;--surface:#26131A;--ink:#FBE9EE;--muted:#C79BA6;--line:#40222B}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.4 'DM Sans','Segoe UI',system-ui,sans-serif}
.bar{display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted)}
.bar[hidden]{display:none}
.bar>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:#2F7BD9;color:#fff}
iframe{flex:1;min-height:0;border:0;width:100%;background:var(--bg)}
</style>
</head>
<body>
<div class="bar" id="devbar" hidden><span class="badge">DEV</span><span id="what">Release candidate</span></div>
<iframe id="app" title="UAply dev build" allow="geolocation"></iframe>
<script src="uaply-nav.js"></script>
<script src="uaply-live.js"></script>
<script src="uaply-profile.js"></script>
<script src="uaply-chat.js"></script>
<script src="uaply-learn.js"></script>
<script src="uaply-envs.js"></script>
<script>
window.UAplyOpts={hideServiceCounts:true,release:true,nearMe:true,simpleTabs:true,navLift:50,consentFirst:true,
  /* Stripe Payment Links (TEST mode, the "UAply sandbox" Stripe account): offered only where the server shows the buy buttons without keys (the owner's own computer, billing_api.buttons) */
  stripeLinks:{starter:"https://buy.stripe.com/test_00w6oA7S25nWcZUcEDcEw00",pro:"https://buy.stripe.com/test_dRm9AM8W6aIgcZU8oncEw01"}};   /* consentFirst: the agreement is asked once, before the first swipe */   /* dev is the release build: no counters, no test controls, no simulated sign-in, no sample data, buy buttons only where billing_api.buttons() says; nearMe: the location prompt, commute slider and nearby jobs first; simpleTabs/navLift: one-word bottom tabs sitting 50px higher on phones */
var PROMOTED=["glide","nav","profile","live","kit","submit","caps","smart","fit","tap","dates","hint","a11y","anim","notice","chat","learn"];   /* "guide" is left out on purpose: it shows "N jobs left" counters; "notice" is only the example-profile banner; "glide" (Phone swipe) replaces "axis" */
var KEY="hireswipe.dev.v1",on={};
PROMOTED.forEach(function(k){on[k]=true});
document.getElementById("what").textContent="Release candidate: "+PROMOTED.map(function(k){return UAplyEnv.FEATURES[k].name}).join(", ");
UAplyEnv.run(document.getElementById("app"),on,KEY,function(err){if(err){document.getElementById("what").textContent="Problem: "+err;document.getElementById("devbar").hidden=false}});
</script>
<script>/* the installable website: shared/uaply-sw.js shows the offline and "starting up" screen when a page cannot load. Only on https or this computer (a service worker needs one). It saves only that screen, never the app or its data */
if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"))window.addEventListener("load",function(){navigator.serviceWorker.register("/uaply-sw.js").catch(function(){})});</script>
</body>
</html>
