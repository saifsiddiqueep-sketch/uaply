<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Lever application</title>
<!-- Lever's hosted form (jobs.lever.co/<company>/<id>/apply), as measured October 21, 2026: li.application-question > label >
     .application-label + .application-field, the place box that searches on keydown and empties itself on blur unless a suggestion is
     chosen (retrieveLocations.js), urls[...] links, custom questions as radios, EEO selects, hCaptcha (invisible), Submit application. -->
<style>body{font:16px system-ui;margin:16px}ul{list-style:none;padding:0}li{margin:14px 0}.application-label{font-weight:700}input,select,textarea{width:100%;font:inherit}.dropdown-container{display:none;border:1px solid #888}.dropdown-location{padding:6px}</style>
</head><body>
<h1>Account Manager at Example Co</h1>
<form id="application-form">
<ul>
  <li class="application-question"><label><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><input type="file" name="resume" id="resume-upload-input" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
  <li class="application-question"><label><div class="application-label">Current location<span class="required">✱</span></div><div class="application-field"><input class="location-input" id="location-input" type="text" name="location" required><input id="selected-location" type="hidden" name="selectedLocation"><div class="dropdown-container"><div class="dropdown-results"></div></div></div></label></li>
  <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
  <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
  <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
  <li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
  <li class="application-question"><div class="application-label">Are you legally authorized to work in the United States?<span class="required">✱</span></div>
    <ul class="application-field"><li><label><input type="radio" name="cards[1][field0]" value="Yes" required> Yes</label></li><li><label><input type="radio" name="cards[1][field0]" value="No"> No</label></li></ul></li>
  <li class="application-question"><div class="application-label">Have you ever been previously employed by Example Co?<span class="required">✱</span></div>
    <ul class="application-field"><li><label><input type="radio" name="cards[1][field1]" value="Yes" required> Yes</label></li><li><label><input type="radio" name="cards[1][field1]" value="No"> No</label></li></ul></li>
  <li class="application-question"><div class="application-label">Do you have any relatives employed by Example Co?<span class="required">✱</span></div>
    <ul class="application-field"><li><label><input type="radio" name="cards[1][field2]" value="Yes" required> Yes</label></li><li><label><input type="radio" name="cards[1][field2]" value="No"> No</label></li></ul></li>
  <li class="application-question"><label><div class="application-label">If you were a former employee, who was your manager?</div><div class="application-field"><input type="text" name="cards[1][field3]"></div></label></li>
  <li class="application-question"><label><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments"></textarea></div></label></li>
</ul>
<h4>U.S. Equal Employment Opportunity information (Completion is voluntary)</h4>
<ul>
  <li class="application-question"><label><div class="application-label">Gender</div><div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div></label></li>
  <li class="application-question"><label><div class="application-label">Race</div><div class="application-field"><select name="eeo[race]"><option value="">Select ...</option><option>White (Not Hispanic or Latino)</option><option>Two or More Races (Not Hispanic or Latino)</option><option>Decline to self-identify</option></select></div></label></li>
  <li class="application-question"><label><div class="application-label">Veteran status</div><div class="application-field"><select name="eeo[veteran]"><option value="">Select ...</option><option>I am a veteran</option><option>I am not a veteran</option><option>Decline to self-identify</option></select></div></label></li>
</ul>
<label><input type="checkbox" name="consent[marketing]"> Yes, Example Co can contact me about future job opportunities.</label>
<div class="h-captcha" data-check data-sitekey="00000000-0000-0000-0000-000000000000" data-size="invisible"></div>
<button type="submit" id="btn-submit" data-submit>Submit application</button>
</form>
<script src="mock.js"></script>
<script>
  // the place box, like Lever's retrieveLocations.js: search on keydown (debounced), choose on mousedown, empty on blur unless chosen
  var loc = document.getElementById("location-input"), box = document.querySelector(".dropdown-container"), res = document.querySelector(".dropdown-results"), t = 0;
  loc.addEventListener("input", function () { box.style.display = "block"; });
  loc.addEventListener("keydown", function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var q = loc.value.toLowerCase();
      res.innerHTML = ["Philadelphia, Pennsylvania, United States", "Philadelphia, Mississippi, United States"].filter(function (x) { return x.toLowerCase().indexOf(q.split(",")[0]) === 0; })
        .map(function (x, i) { return '<div class="dropdown-location" id="location-' + i + '">' + x + '</div>'; }).join("");
    }, 500);
  });
  loc.addEventListener("blur", function () { if (box.style.display !== "none") { box.style.display = "none"; res.innerHTML = ""; loc.value = ""; document.getElementById("selected-location").value = ""; } });
  document.addEventListener("mousedown", function (e) {
    var d = e.target.closest(".dropdown-location"); if (!d) return;
    box.style.display = "none"; loc.value = d.textContent; document.getElementById("selected-location").value = JSON.stringify({ name: d.textContent }); res.innerHTML = "";
  });
  mockSubmit(document.getElementById("application-form"), "Application submitted!");
</script>
</body></html>
